baseURL = "https://ulsonhu.cn/"
languageCode = "zh-cn"
defaultContentLanguage = "zh"
title = "Nichome"
theme = "PaperMod"
paginate = 10
enableRobotsTXT = true
enableGitInfo = false
disablePathToLower = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  author = "Watson Hu"
  description = "Lying in the gutter, but looking at the stars."
  keywords = ["统计学", "机器学习", "前端", "博客"]
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  ShowToc = true
  TocOpen = false
  comments = false

  [params.homeInfoParams]
    Title = "Nichome - Watson's Blog"
    Content = "Lying in the gutter, but looking at the stars."

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/ulsonhu"
  [[params.socialIcons]]
    name = "rss"
    url = "https://ulsonhu.cn/index.xml"

[[menu.main]]
  name = "归档"
  url = "/archives/"
  weight = 1
[[menu.main]]
  name = "分类"
  url = "/categories/"
  weight = 2
[[menu.main]]
  name = "标签"
  url = "/tags/"
  weight = 3
[[menu.main]]
  name = "搜索"
  url = "/search/"
  weight = 4
[[menu.main]]
  name = "关于"
  url = "/about/"
  weight = 5

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "monokai"
    lineNos = false
    guessSyntax = true
