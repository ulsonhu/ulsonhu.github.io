{{ define "main" }}
<article class="post-container">
  {{ partial "post-header.html" . }}
  <div class="post-content">{{ .Content }}</div>
  {{ if eq .Section "posts" }}
  <footer class="post-footer">
    {{ with .Params.tags }}
    <div class="post-tags tag-list">
      {{ range . }}<a href="{{ "/tags/" | relURL }}{{ . | urlize }}/">{{ . }}</a>{{ end }}
    </div>
    {{ end }}
    <nav class="post-nav">
      <span>{{ with .PrevInSection }}<a href="{{ .Permalink }}">&larr; {{ .Title }}</a>{{ end }}</span>
      <span>{{ with .NextInSection }}<a href="{{ .Permalink }}">{{ .Title }} &rarr;</a>{{ end }}</span>
    </nav>
  </footer>
  {{ end }}
</article>
{{ end }}
